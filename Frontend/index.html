<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        PragyanAI PDF Merger
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="app">


    <!-- ================================================
         SIDEBAR
    ================================================= -->

    <aside class="sidebar">


        <div class="logo">

            <div class="logo-icon">
                P
            </div>

            <div>

                <h2>
                    PragyanAI
                </h2>

                <span>
                    File Merger
                </span>

            </div>

        </div>


        <nav>


            <button
                id="pdfModeBtn"
                class="side-btn active"
            >

                📄

                <span>
                    Merge Files
                </span>

            </button>


            <button
                id="imageModeBtn"
                class="side-btn"
            >

                🖼️

                <span>
                    Merge Images
                </span>

            </button>


            <button
                id="clearWorkspaceBtn"
                class="side-btn clear-btn"
            >

                🗑️

                <span>
                    Clear Workspace
                </span>

            </button>


        </nav>


    </aside>


    <!-- ================================================
         MAIN
    ================================================= -->

    <main class="main-content">


        <header class="header">

            <h1 id="pageTitle">
                Merge PDF Files
            </h1>

            <p id="pageSubtitle">
                Combine multiple PDF files into one PDF.
            </p>

        </header>


        <!-- ============================================
             UPLOAD
        ============================================= -->

        <section class="upload-section">


            <div
                id="dropZone"
                class="drop-zone"
            >


                <div class="upload-icon">
                    ⬆️
                </div>


                <h2 id="uploadTitle">
                    Drop PDF files here
                </h2>


                <p id="uploadText">
                    or click to select PDF files
                </p>


                <input
                    type="file"
                    id="fileInput"
                    multiple
                    accept=".pdf"
                >


                <button
                    type="button"
                    id="browseBtn"
                    class="browse-btn"
                >

                    Browse Files

                </button>


                <p class="upload-info">
                    Maximum 20 files
                </p>


            </div>


        </section>


        <!-- ============================================
             STATUS
        ============================================= -->

        <div
            id="statusMessage"
            class="status-message"
        ></div>


        <!-- ============================================
             FILE LIST
        ============================================= -->

        <section class="files-section">


            <div class="section-header">


                <div>

                    <h2 id="filesTitle">
                        PDF Files
                    </h2>

                    <span id="fileCount">
                        0 files
                    </span>

                </div>


                <button
                    id="removeAllBtn"
                    class="remove-all-btn"
                >

                    Remove All

                </button>


            </div>


            <div
                id="fileList"
                class="file-list"
            >


                <div class="empty-state">

                    <div>
                        📁
                    </div>

                    <p>
                        No files added yet
                    </p>

                </div>


            </div>


        </section>


        <!-- ============================================
             MERGE
        ============================================= -->

        <button
            id="mergeBtn"
            class="merge-btn"
            disabled
        >

            <span id="mergeBtnText">
                Merge & Download PDF
            </span>

        </button>


    </main>


</div>


<script src="script.js"></script>

</body>

</html>
